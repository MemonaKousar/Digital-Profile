<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memona Kousar | Digital Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f0ff, #e8f0ff, #fff5f8);
            color: #252b48;
            min-height: 100vh;
        }

        /* NAVBAR */
        nav {
            background: #202942;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav h2 {
            color: white;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 22px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav ul li a:hover {
            color: #d7a7ff;
        }

        /* HERO */
        .hero {
            min-height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px;
        }

        .profile-container {
            max-width: 850px;
        }

        .profile-pic {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #202942;
        }

        .hero h3 {
            color: #7454a6;
            margin-bottom: 18px;
            font-size: 21px;
        }

        .hero p {
            max-width: 700px;
            margin: auto;
            line-height: 1.8;
            font-size: 17px;
        }

        /* BUTTONS */
        .buttons {
            margin-top: 25px;
        }

        button,
        .upload-label {
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            background: #202942;
            color: white;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }

        button:hover,
        .upload-label:hover {
            background: #7454a6;
        }

        #imageUpload {
            display: none;
        }

        /* SECTIONS */
        section {
            max-width: 1000px;
            margin: 35px auto;
            padding: 35px;
            background: rgba(255,255,255,0.85);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        section h2 {
            color: #202942;
            margin-bottom: 20px;
            font-size: 28px;
            border-left: 5px solid #b58be0;
            padding-left: 12px;
        }

        section p {
            line-height: 1.8;
            margin-bottom: 15px;
            font-size: 16px;
        }

        /* EDUCATION */
        .education-card {
            background: #f5f0ff;
            padding: 20px;
            margin: 15px 0;
            border-radius: 14px;
            border-left: 5px solid #8e6bb8;
        }

        .education-card h3 {
            margin-bottom: 7px;
            color: #202942;
        }

        /* SKILLS */
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .skill {
            background: #202942;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
        }

        /* HOBBIES */
        .hobbies {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .hobby {
            background: #f5f0ff;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06);
            transition: 0.3s;
        }

        .hobby:hover {
            transform: translateY(-5px);
        }

        /* CONTACT */
        .contact-box {
            line-height: 2.2;
            font-size: 17px;
        }

        /* EDIT PANEL */
        #editPanel {
            display: none;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        label {
            font-weight: bold;
        }

        /* FOOTER */
        footer {
            background: #202942;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }

        /* MOBILE */
        @media(max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 12px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero h1 {
                font-size: 32px;
            }

            section {
                margin: 20px 12px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>
