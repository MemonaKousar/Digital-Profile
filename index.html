<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memona Kausar | Personal Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #faf8ff;
            color: #202b50;
            line-height: 1.7;
        }

        /* Navbar */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #202942;
            padding: 16px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: 700;
        }

        .logo span {
            color: #c79bea;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            color: #d6a8f5;
        }

        /* Hero */
        .hero {
            min-height: 390px;
            padding: 65px 8%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 70px;
            background: linear-gradient(135deg, #f3eaff, #fffdfb);
        }

        /* Profile Image Container */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .profile-image {
            width: 230px;
            height: 230px;
            object-fit: cover;
            border-radius: 50%;
            border: 7px solid #c895ed;
            box-shadow: 0 10px 30px rgba(70, 45, 100, 0.15);
        }

        /* Upload Button */
        .upload-btn {
            background: #68458f;
            color: white;
            padding: 9px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .upload-btn:hover {
            background: #8058ad;
        }

        .hero-text h1 {
            font-size: 55px;
            color: #202b50;
            margin-bottom: 5px;
        }

        .hero-text h2 {
            color: #8058ad;
            font-size: 23px;
            margin-bottom: 12px;
        }

        .hero-text p {
            font-size: 18px;
            color: #555b70;
        }

        /* Main */
        .container {
            width: 90%;
            max-width: 1150px;
            margin: 45px auto;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            border: 1px solid #eee4fa;
            box-shadow: 0 8px 25px rgba(55, 42, 90, 0.06);
        }

        .card h2 {
            color: #68458f;
            margin-bottom: 18px;
            font-size: 27px;
        }

        .card p {
            color: #50576b;
        }

        /* Education */
        .education-item {
            margin-bottom: 22px;
            padding-left: 18px;
            border-left: 4px solid #b77de3;
        }

        .education-item h3 {
            color: #27345c;
        }

        .education-item p {
            margin: 3px 0;
        }

        /* Skills */
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .skill {
            background: #f0e3fb;
            color: #5c3d80;
            padding: 8px 17px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Languages */
        .languages {
            margin-top: 25px;
        }

        .languages h3 {
            margin-bottom: 12px;
            color: #68458f;
        }

        /* Contact */
        .contact p {
            margin: 12px 0;
            font-size: 16px;
        }

        .contact a {
            color: #68458f;
            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            margin-top: 60px;
            background: #202942;
            color: white;
            text-align: center;
            padding: 22px;
        }

        /* Mobile */
        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                gap: 12px;
            }

            nav ul {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero {
                flex-direction: column;
                text-align: center;
                gap: 25px;
            }

            .hero-text h1 {
                font-size: 40px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">Memona <span>Kausar</span></div>

        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#education">Education</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>


    <!-- Hero -->
    <section class="hero" id="home">

        <!-- Profile Picture -->
        <div class="profile-container">

            <img id="profileImage"
                 src="profile.jpg"
                 alt="Memona Kausar"
                 class="profile-image">

            <label for="imageUpload" class="upload-btn">
                Change Profile Picture
